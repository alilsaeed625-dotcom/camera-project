<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>التقاط الصورة وإرسالها لواتساب</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      gap: 14px;
      text-align: center;
    }
    video, img {
      width: 100%;
      max-width: 380px;
      border-radius: 12px;
      background: #000;
    }
    img {
      display: none;
      border: 2px solid #2ea043;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 11px 18px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
    }
    #startBtn { background: #1f6feb; }
    #snapBtn  { background: #2ea043; }
    #status   { font-size: 14px; color: #ccc; max-width: 380px; }
  </style>
</head>
<body>
  <div id="status">اضغط على "تشغيل الكاميرا" للبدء</div>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <img id="preview" alt="معاينة الصورة الملتقطة" />

  <div class="actions">
    <button id="startBtn" type="button">تشغيل الكاميرا</button>
    <button id="snapBtn" type="button" disabled>التقاط وإرسال لواتساب</button>
  </div>

  <script>
    const TARGET_WHATSAPP = '0984492456';
    const BACKEND_URL     = 'https://YOUR_BACKEND_URL/send-whatsapp'; // ضع رابط الخدمة الخلفية هنا

    const video    = document.getElementById('video');
    const canvas   = document.getElementById('canvas');
    const preview  = document.getElementById('preview');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const snapBtn  = document.getElementById('snapBtn');

    let streamRef = null;

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusEl.textContent = 'المتصفح لا يدعم الكاميرا أو الاتصال غير آمن (HTTPS مطلوب).';
        return;
      }
      try {
        statusEl.textContent = 'جاري طلب إذن الكاميرا...';
        streamRef = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        video.srcObject = streamRef;
        snapBtn.disabled = false;
        statusEl.textContent = 'الكاميرا جاهزة. اضغط "التقاط وإرسال لواتساب".';
      } catch (err) {
        statusEl.textContent = 'تم رفض الإذن أو تعذر فتح الكاميرا.';
      }
    }

    function captureAndSend() {
      if (!video.videoWidth || !video.videoHeight) {
        statusEl.textContent = 'الكاميرا لم تجهز بعد، حاول مجدداً.';
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      preview.src = canvas.toDataURL('image/jpeg', 0.9);
      preview.style.display = 'block';

      canvas.toBlob(async (blob) => {
        if (!blob) {
          statusEl.textContent = 'تعذر تجهيز ملف الصورة.';
          return;
        }

        const formData = new FormData();
        formData.append('photo', blob, 'capture.jpg');
        formData.append('phone', TARGET_WHATSAPP);

        statusEl.textContent = `جاري إرسال الصورة إلى الرقم ${TARGET_WHATSAPP}...`;
        try {
          const res = await fetch(BACKEND_URL, {
            method: 'POST',
            body: formData
          });

          if (!res.ok) {
            throw new Error('فشل الاستجابة من الخادم: ' + res.status);
          }

          statusEl.textContent = `تم التقاط الصورة وإرسالها إلى ${TARGET_WHATSAPP} بنجاح.`;
          if (streamRef) {
            streamRef.getTracks().forEach(track => track.stop());
          }
        } catch (err) {
          statusEl.textContent = 'تعذر الإرسال، تأكد من رابط الخدمة الخلفية وإعدادات CORS.';
        }
      }, 'image/jpeg', 0.9);
    }

    startBtn.addEventListener('click', startCamera);
    snapBtn.addEventListener('click', captureAndSend);
  </script>
</body>
</html>
